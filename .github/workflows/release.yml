name: Build and release installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test TurnSteamOn.Tests/TurnSteamOn.Tests.csproj

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: .\Installer\Build-Installer.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0-build.${{ github.run_number }}"
          $installer = "Installer/output/TurnSteamOn-Setup-1.0.0.exe"
          gh release create $tag $installer `
            --title "Turn Steam On $tag" `
            --generate-notes
